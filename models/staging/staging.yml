version: 2

models:
  - name: stg_sales
    description: "Ventas tipadas y estandarizadas."
    columns:
      - name: sale_id
        description: "Identificador único de la venta."
        data_tests:
          - not_null
          - unique

      - name: product_id
        description: "Identificador del producto."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: sales_amount
        description: "Importe total de la línea de venta."
        data_tests:
          - not_null

  - name: stg_products
    description: "Maestro de productos limpio."
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: product_name
        data_tests:
          - not_null